<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>組織学単語帳「鉄壁」暗記アプリ</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1976d2">
    <link rel="apple-touch-icon" href="tetsuheki-icon-192.png">
    <style>
        body {
            font-family: sans-serif;
            background: #f0f4f8;
            text-align: center;
            padding-top: 40px;
        }

        #word-card {
            background: white;
            width: 300px;
            margin: 20px auto;
            padding: 40px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 12px rgba(26, 12, 12, 0.5);
        }

        #word {
            font-size: 36px;
            font-weight: bold;
            margin: 0;
        }

        #meaning {
            font-size: 24px;
            color: #2e7d32;
        }

        button {
            font-size: 16px;
            padding: 10px 24px;
            margin: 0 6px;
            border: none;
            border-radius: 8px;
            background: #1976d2;
            color: white;
            cursor: pointer;
        }
        #group-tabs {
            display: flex;
            gap: 8px;
            max-width: 600px;
            margin: 0 auto;
            overflow-x: auto;
        }
        #group-tabs .tab {
            font-size: 18px;
            padding: 14px 20px;
            margin: 0;
            background: #dfe7ef;
            color: #333;
            border-radius: 12px 12px 0 0;
            flex-shrink: 0;
            white-space: nowrap;
        }

        #group-tabs .tab.selected {
            background: #1976d2;
            color: white;
        }

        #group-tabs .tab:first-child {
            position: sticky;
            left: 0;
            z-index: 1;
        }

        #known-button {
            background: #2e7d32;
        }

        #unknown-button {
            background: #e65100;
        }
    </style>
</head>
<body>
    <h1>単語暗記アプリ</h1>
    <div id="group-tabs"></div>
    <p id="count">覚えた 0 / 0</p>
    <div id="word-card">
        <p id="word">apple</p>
    </div>
    <button id="show-button">意味を見る</button>
    <div id="answer-buttons" style="display: none;">
    <button id="known-button">覚えた</button>
    <button id="unknown-button">まだ</button>
</div>
    <p id="meaning" style="display: none;">りんご</p>
    <script src="words.js"></script>
    <script>
     const word = document.getElementById('word')
    const meaning = document.getElementById('meaning')
        const showButton = document.getElementById('show-button')
    const groupTabs = document.getElementById('group-tabs')
    const countText = document.getElementById('count')
    const answerButtons = document.getElementById('answer-buttons')
    const knownButton = document.getElementById('known-button')
    const unknownButton = document.getElementById('unknown-button')

    const groups = []
    for (const w of words) {
      if (!groups.includes(w.group)) {
        groups.push(w.group)
      }
    }

    let currentWords = words
    let knownWords = new Set(JSON.parse(localStorage.getItem('knownWords') || '[]'))

    function keyOf(w) {
      return w.group + '|' + w.word
    }

    function saveKnownWords() {
      localStorage.setItem('knownWords', JSON.stringify([...knownWords]))
    }
    function updateCount() {
     const knownCount = currentWords.filter((w) => knownWords.has(keyOf(w))).length
      countText.textContent = '覚えた ' + knownCount + ' / ' + currentWords.length 
    }

    function selectGroup(group, tab) {
      if (group === 'all') {
        currentWords = words
      } else {
        currentWords = words.filter((w) => w.group === group)
      }
      currentIndex = 0
      for (const t of groupTabs.children) {
        t.classList.remove('selected')
      }
      tab.classList.add('selected')
      updateCount()
      showCurrentWord()
    }

    function makeTab(name, group) {
      const tab = document.createElement('button')
      tab.textContent = name
      tab.className = 'tab'
      tab.addEventListener('click', () => selectGroup(group, tab))
      groupTabs.appendChild(tab)
      return tab
    }

    const allTab = makeTab('すべて', 'all')
    for (const g of groups) {
      makeTab(g, g)
    }
    let currentIndex = 0

    function showCurrentWord() {
      word.textContent = currentWords[currentIndex].word
      meaning.textContent = currentWords[currentIndex].meaning
      meaning.style.display = 'none'
      showButton.style.display = 'inline-block'
      answerButtons.style.display = 'none'
    }

    showButton.addEventListener('click', () => {
      meaning.style.display = 'block'
      showButton.style.display = 'none'
      answerButtons.style.display = 'inline-block'
    })
    function goNext() {
      currentIndex = currentIndex + 1
      if (currentIndex >= currentWords.length) {
        currentIndex = 0
      }
       showCurrentWord()
    }

    knownButton.addEventListener('click', () => {
     knownWords.add(keyOf(currentWords[currentIndex]))
      saveKnownWords()
      updateCount()
      goNext()
    })

    unknownButton.addEventListener('click', () => {
    knownWords.delete(keyOf(currentWords[currentIndex]))
      saveKnownWords()
      updateCount()
      goNext()
    })
    

    　selectGroup('all', allTab)

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
    }
  </script>
</body>
</html>
